[project]
name = "contextos-backend"
version = "0.1.0"
description = "ContextOS API: agentic RAG over live data and persistent memory"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
# Let tests do `import app` when pytest runs from backend/.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the Docker services running (docker compose up -d)"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
